<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <!-- Speech Bubble -->
  <g id="speech-bubble">
    <rect x="70" y="248" width="98" height="60" rx="12" fill="#2d60ed" stroke="#0f265c" stroke-width="3"/>
    <polygon points="82,308 98,308 82,324" fill="#2d60ed"/>
    <polyline points="82,308 82,324 98,308" stroke="#0f265c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="95" cy="278" r="4" fill="#ffffff"/>
    <circle cx="119" cy="278" r="4" fill="#ffffff"/>
    <circle cx="143" cy="278" r="4" fill="#ffffff"/>
  </g>

  <!-- Dashboard Window Screen -->
  <g id="dashboard">
    <rect x="208" y="268" width="468" height="332" rx="16" fill="#ffffff" stroke="#0f265c" stroke-width="3"/>
    
    <!-- Browser Top Bar -->
    <path d="M 210 284 A 14 14 0 0 1 224 270 L 660 270 A 14 14 0 0 1 674 284 L 674 312 L 210 312 Z" fill="#2d60ed" stroke="#0f265c" stroke-width="3"/>
    <circle cx="238" cy="291" r="5" fill="#ffffff"/>
    <circle cx="256" cy="291" r="5" fill="#ffffff"/>
    <circle cx="274" cy="291" r="5" fill="#ffffff"/>
    
    <!-- Address Bar -->
    <rect x="338" y="282" width="316" height="18" rx="9" fill="#ffffff" stroke="#0f265c" stroke-width="2"/>

    <!-- UI Components / Wireframe Panels -->
    <!-- Top Left Card with Wave Chart -->
    <rect x="246" y="326" width="108" height="110" rx="10" fill="#ced8e6" stroke="#0f265c" stroke-width="2"/>
    <path d="M 248 410 C 270 360 290 420 310 375 C 330 350 340 380 352 365" stroke="#2d60ed" stroke-width="3" fill="none"/>

    <!-- Top Center Card with Bar Chart & Line -->
    <rect x="378" y="350" width="106" height="86" rx="8" fill="#ced8e6" stroke="#0f265c" stroke-width="2"/>
    <path d="M 388 388 L 412 370 L 436 382 L 468 358" stroke="#2d60ed" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="390" y="398" width="12" height="30" fill="#2d60ed"/>
    <rect x="410" y="390" width="12" height="38" fill="#2d60ed"/>
    <rect x="430" y="404" width="12" height="24" fill="#2d60ed"/>
    <rect x="450" y="382" width="12" height="46" fill="#2d60ed"/>

    <!-- Top Right Text Placeholders -->
    <rect x="530" y="326" width="48" height="14" rx="7" fill="#ced8e6" stroke="#0f265c" stroke-width="2"/>
    <rect x="592" y="326" width="42" height="14" rx="7" fill="#ced8e6" stroke="#0f265c" stroke-width="2"/>
    <rect x="510" y="350" width="124" height="18" rx="6" fill="#7d93b3" stroke="#0f265c" stroke-width="2"/>
    <rect x="510" y="382" width="124" height="20" rx="6" fill="#7d93b3" stroke="#0f265c" stroke-width="2"/>
    <rect x="510" y="416" width="60" height="14" rx="5" fill="#ced8e6" stroke="#0f265c" stroke-width="2"/>

    <!-- Bottom Left Card Placeholder -->
    <rect x="246" y="450" width="108" height="70" rx="8" fill="#ced8e6" stroke="#0f265c" stroke-width="2"/>

    <!-- Bottom Middle Lines -->
    <rect x="378" y="462" width="106" height="18" rx="6" fill="#7d93b3" stroke="#0f265c" stroke-width="2"/>
    <rect x="378" y="492" width="60" height="10" rx="5" fill="#ced8e6" stroke="#0f265c" stroke-width="2"/>

    <!-- Bottom Right Panel -->
    <rect x="510" y="462" width="124" height="88" rx="8" fill="#ced8e6" stroke="#0f265c" stroke-width="2"/>

    <!-- Screen Support Leg Base -->
    <rect x="458" y="600" width="8" height="34" fill="#ffffff" stroke="#0f265c" stroke-width="3"/>
    <circle cx="462" cy="642" r="8" fill="#ffffff" stroke="#0f265c" stroke-width="3"/>
  </g>

  <!-- Ground / Floor Line -->
  <line x1="10" y1="728" x2="780" y2="728" stroke="#0f265c" stroke-width="3"/>

  <!-- Left Standing Character (Presenter) -->
  <g id="presenter">
    <!-- Shoes -->
    <path d="M 44 706 C 44 728 82 728 86 706 Z" fill="#2d60ed" stroke="#0f265c" stroke-width="3"/>
    <path d="M 118 706 C 118 728 170 728 170 706 Z" fill="#2d60ed" stroke="#0f265c" stroke-width="3"/>

    <!-- Pants -->
    <path d="M 68 522 L 44 702 L 80 702 L 102 562 L 118 702 L 146 702 L 148 522 Z" fill="#18366b" stroke="#0f265c" stroke-width="3" stroke-linejoin="round"/>

    <!-- Inner Shirt -->
    <path d="M 98 402 L 136 402 L 136 522 L 98 522 Z" fill="#c3e0f7" stroke="#0f265c" stroke-width="2"/>

    <!-- Outer Jacket -->
    <path d="M 90 398 Q 50 408 44 480 L 68 532 L 98 532 L 94 422 Z" fill="#b1cadc" stroke="#0f265c" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 136 398 Q 186 402 188 470 L 154 532 L 132 532 L 136 422 Z" fill="#b1cadc" stroke="#0f265c" stroke-width="3" stroke-linejoin="round"/>

    <!-- Left Arm -->
    <path d="M 46 414 Q 28 472 68 480" stroke="#0f265c" stroke-width="3" fill="none"/>
    <circle cx="112" cy="468" r="10" fill="#fbc3a1" stroke="#0f265c" stroke-width="2"/>

    <!-- Right Arm & Pointing Hand -->
    <path d="M 172 418 L 202 414 L 182 462" fill="#b1cadc" stroke="#0f265c" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="196" cy="398" r="6" fill="#fbc3a1" stroke="#0f265c" stroke-width="2"/>
    <path d="M 198 394 L 206 382" stroke="#0f265c" stroke-width="3" stroke-linecap="round"/>

    <!-- Head & Neck -->
    <rect x="100" y="380" width="16" height="22" fill="#fbc3a1" stroke="#0f265c" stroke-width="2"/>
    <path d="M 92 372 C 88 340 138 334 138 370 C 138 396 92 396 92 372 Z" fill="#fbc3a1" stroke="#0f265c" stroke-width="3"/>
    
    <!-- Hair -->
    <path d="M 88 370 C 84 340 128 330 138 350 C 122 338 98 350 98 370 Z" fill="#18366b" stroke="#0f265c" stroke-width="3"/>

    <!-- Facial Features -->
    <circle cx="120" cy="368" r="2" fill="#0f265c"/>
    <path d="M 112 378 Q 120 384 126 378" stroke="#0f265c" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Middle Seated Character (Left) -->
  <g id="seated-left">
    <!-- Chair Base & Legs -->
    <path d="M 234 642 L 200 728" stroke="#0f265c" stroke-width="3"/>
    <path d="M 248 642 L 238 728" stroke="#0f265c" stroke-width="3"/>
    <path d="M 292 642 L 304 728" stroke="#0f265c" stroke-width="3"/>
    <rect x="190" y="532" width="70" height="110" rx="14" fill="#2d60ed" stroke="#0f265c" stroke-width="3"/>

    <!-- Pants & Seated Legs -->
    <path d="M 250 584 L 382 588 L 418 706 L 382 706 L 358 632 L 250 630 Z" fill="#18366b" stroke="#0f265c" stroke-width="3" stroke-linejoin="round"/>
    <!-- Shoe Left -->
    <path d="M 380 706 C 380 728 432 728 430 706 Z" fill="#2d60ed" stroke="#0f265c" stroke-width="3"/>

    <!-- Torso -->
    <path d="M 208 488 C 208 488 280 488 296 532 L 250 600 L 208 584 Z" fill="#2d60ed" stroke="#0f265c" stroke-width="3" stroke-linejoin="round"/>

    <!-- Arm & Tablet -->
    <path d="M 280 532 L 340 546" stroke="#2d60ed" stroke-width="16" stroke-linecap="round"/>
    <path d="M 280 532 L 340 546" stroke="#0f265c" stroke-width="3" fill="none"/>
    <rect x="342" y="498" width="50" height="48" rx="6" fill="#c3e0f7" stroke="#0f265c" stroke-width="3" transform="rotate(-15, 342, 498)"/>

    <!-- Head & Hair -->
    <circle cx="258" cy="458" r="18" fill="#fbc3a1" stroke="#0f265c" stroke-width="3"/>
    <path d="M 224 480 C 218 438 274 422 284 458 C 284 488 238 498 224 480 Z" fill="#18366b" stroke="#0f265c" stroke-width="3"/>
    <circle cx="270" cy="456" r="2" fill="#0f265c"/>
    <path d="M 264 466 Q 270 470 274 466" stroke="#0f265c" stroke-width="2" fill="none"/>

    <!-- Desk Surface Front Section -->
    <line x1="290" y1="562" x2="428" y2="562" stroke="#0f265c" stroke-width="3"/>
  </g>

  <!-- Right Seated Character (Right) -->
  <g id="seated-right">
    <!-- Chair Base & Legs -->
    <path d="M 626 642 L 614 728" stroke="#0f265c" stroke-width="3"/>
    <path d="M 670 642 L 682 728" stroke="#0f265c" stroke-width="3"/>
    <path d="M 684 642 L 720 728" stroke="#0f265c" stroke-width="3"/>
    <rect x="640" y="532" width="70" height="110" rx="14" fill="#2d60ed" stroke="#0f265c" stroke-width="3"/>

    <!-- Pants & Seated Legs -->
    <path d="M 650 584 L 518 588 L 482 706 L 518 706 L 542 632 L 650 630 Z" fill="#18366b" stroke="#0f265c" stroke-width="3" stroke-linejoin="round"/>
    <!-- Shoe Right -->
    <path d="M 520 706 C 520 728 468 728 470 706 Z" fill="#2d60ed" stroke="#0f265c" stroke-width="3"/>

    <!-- Torso -->
    <path d="M 692 488 C 692 488 620 488 604 532 L 650 600 L 692 584 Z" fill="#2d60ed" stroke="#0f265c" stroke-width="3" stroke-linejoin="round"/>

    <!-- Arm & Tablet -->
    <path d="M 620 532 L 560 546" stroke="#2d60ed" stroke-width="16" stroke-linecap="round"/>
    <path d="M 620 532 L 560 546" stroke="#0f265c" stroke-width="3" fill="none"/>
    <rect x="508" y="498" width="50" height="48" rx="6" fill="#c3e0f7" stroke="#0f265c" stroke-width="3" transform="rotate(15, 508, 498)"/>

    <!-- Head & Hair -->
    <circle cx="642" cy="458" r="18" fill="#fbc3a1" stroke="#0f265c" stroke-width="3"/>
    <path d="M 676 480 C 682 438 626 422 616 458 C 616 488 662 498 676 480 Z" fill="#18366b" stroke="#0f265c" stroke-width="3"/>
    <circle cx="630" cy="456" r="2" fill="#0f265c"/>
    <path d="M 626 466 Q 632 470 636 466" stroke="#0f265c" stroke-width="2" fill="none"/>

    <!-- Desk Surface Front Section -->
    <line x1="610" y1="562" x2="472" y2="562" stroke="#0f265c" stroke-width="3"/>
  </g>
</svg>
